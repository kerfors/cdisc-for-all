# The links between base rows. Hand-kept; the link-graph builder (cfa.link) and the link SHACL shapes are generated from it.
# One slot per link. The slot is the link property: slot_uri {ns}link/{source}/{table}#{column} for a published
# key, {ns}rule/{source}/{table}#{column}/{target source}/{target table} for a link by rule ({column} = the base
# column the link rests on; a link by rule names its target, since several rules may rest on one column).
# domain = the base class of the rows the link starts from; range = the base class of the target rows.
# Annotations (JSON lists where more than one column):
#   link:          "published key" or "by rule"
#   columns:       the base columns of the domain whose values are the key, in order; the last is the column the link rests on
#   target:        the base columns of the range that the values must equal, in the same order
#   target_empty:  base columns of the range that must be empty on the target (optional)
#   separator:     the column holds several keys, split at this text, surrounding spaces removed (optional)
#   rule:          the rule, stated (by rule only)
#   flag:          a marker the target publishes, JSON {"column": c, "ends_with": text}: a linked row whose target's
#                  column ends with the text is reported too (the link stays); flag_rule states it (optional)
# Links by rule only:
#   requires:      columns that must have a value for the link to apply (a row without them is outside the link)
#   unless:        earlier links: the link applies only to a row that has none of them
#   match_empty:   key columns (not the last) whose empty value matches an empty target column
#   targets:       "all": every matching target row is linked; a row with more targets than keys is reported too
#   rule_function: the function of cfa.link that implements the stated rule (target keys to try, in order)
# A link is made only where the target row exists and is the only row that matches. A row that has a value in the
# link column and no link is reported (SHACL, sh:Info): that report is Link_Check. Broken links stay broken.
id: https://kerfors.github.io/cdisc-for-all/def/links
name: links
title: cdisc-for-all, the links between base rows
prefixes:
  linkml: https://w3id.org/linkml/
imports:
  - linkml:types
  - nsv_registry
  - cosmos
  - sdtmig
  - sdtm_model
  - sdtm_ct
  - ncit_flat
  - nci_code_cui_map
default_range: string
slots:

  # --- SDTM CT

  "sdtm-ct term to codelist":
    description: A term row of SDTM CT to the codelist row of its codelist.
    slot_uri: https://kerfors.github.io/cdisc-for-all/link/sdtm-ct/SDTM%20Terminology#Codelist%20Code
    domain: "SDTM Terminology"
    range: "SDTM Terminology"
    annotations:
      link: published key
      columns: '["Codelist Code"]'
      target: '["Code"]'
      target_empty: '["Codelist Code"]'

  "sdtm-ct to NCIt":
    description: A row of SDTM CT (codelist or term) to the NCIt concept of its code.
    slot_uri: https://kerfors.github.io/cdisc-for-all/link/sdtm-ct/SDTM%20Terminology#Code
    domain: "SDTM Terminology"
    range: "Thesaurus"
    annotations:
      link: published key
      columns: '["Code"]'
      target: '["code"]'

  # --- COSMoS

  "cosmos dataset specialization to codelist":
    description: A Dataset Specialization variable row to the SDTM CT codelist row of its codelist.
    slot_uri: https://kerfors.github.io/cdisc-for-all/link/cosmos/cdisc_sdtm_dataset_specializations_latest#codelist
    domain: cdisc_sdtm_dataset_specializations_latest
    range: "SDTM Terminology"
    annotations:
      link: published key
      columns: '["codelist"]'
      target: '["Code"]'
      target_empty: '["Codelist Code"]'

  "cosmos dataset specialization to assigned term":
    description: A Dataset Specialization variable row to the SDTM CT term row of its assigned term, within its codelist.
    slot_uri: https://kerfors.github.io/cdisc-for-all/link/cosmos/cdisc_sdtm_dataset_specializations_latest#assigned_term
    domain: cdisc_sdtm_dataset_specializations_latest
    range: "SDTM Terminology"
    annotations:
      link: published key
      columns: '["codelist", "assigned_term"]'
      target: '["Codelist Code", "Code"]'

  "cosmos dataset specialization to biomedical concept":
    description: A Dataset Specialization variable row to the row of its BC in the BC hierarchy table (one row per BC).
    slot_uri: https://kerfors.github.io/cdisc-for-all/link/cosmos/cdisc_sdtm_dataset_specializations_latest#bc_id
    domain: cdisc_sdtm_dataset_specializations_latest
    range: cdisc_biomedical_concepts_hierarchy_latest
    annotations:
      link: published key
      columns: '["bc_id"]'
      target: '["bc_id"]'
      flag: '{"column": "bc_short_name", "ends_with": "[RETIRED]"}'
      flag_rule: A Dataset Specialization row whose BC has a bc_short_name ending in "[RETIRED]", the marker COSMoS publishes for a retired BC, is reported. The link stays.

  "cosmos dataset specialization to data element concept":
    description: A Dataset Specialization variable row to the BC row of its data element concept, within its BC.
    slot_uri: https://kerfors.github.io/cdisc-for-all/link/cosmos/cdisc_sdtm_dataset_specializations_latest#dec_id
    domain: cdisc_sdtm_dataset_specializations_latest
    range: cdisc_biomedical_concepts_latest
    annotations:
      link: published key
      columns: '["bc_id", "dec_id"]'
      target: '["bc_id", "dec_id"]'

  "cosmos biomedical concept to NCIt":
    description: A BC row to the NCIt concept of its ncit_code.
    slot_uri: https://kerfors.github.io/cdisc-for-all/link/cosmos/cdisc_biomedical_concepts_latest#ncit_code
    domain: cdisc_biomedical_concepts_latest
    range: "Thesaurus"
    annotations:
      link: published key
      columns: '["ncit_code"]'
      target: '["code"]'

  "cosmos data element concept to NCIt":
    description: A BC row to the NCIt concept of its ncit_dec_code.
    slot_uri: https://kerfors.github.io/cdisc-for-all/link/cosmos/cdisc_biomedical_concepts_latest#ncit_dec_code
    domain: cdisc_biomedical_concepts_latest
    range: "Thesaurus"
    annotations:
      link: published key
      columns: '["ncit_dec_code"]'
      target: '["code"]'

  "cosmos biomedical concept to parent":
    description: A BC row to the hierarchy row of its parent BC.
    slot_uri: https://kerfors.github.io/cdisc-for-all/link/cosmos/cdisc_biomedical_concepts_latest#parent_bc_id
    domain: cdisc_biomedical_concepts_latest
    range: cdisc_biomedical_concepts_hierarchy_latest
    annotations:
      link: published key
      columns: '["parent_bc_id"]'
      target: '["bc_id"]'

  "cosmos hierarchy to parent":
    description: A BC hierarchy row to the hierarchy row of its parent BC.
    slot_uri: https://kerfors.github.io/cdisc-for-all/link/cosmos/cdisc_biomedical_concepts_hierarchy_latest#parent_bc_id
    domain: cdisc_biomedical_concepts_hierarchy_latest
    range: cdisc_biomedical_concepts_hierarchy_latest
    annotations:
      link: published key
      columns: '["parent_bc_id"]'
      target: '["bc_id"]'

  # --- SDTMIG and SDTM Model (sign-in sources)

  "sdtmig variable to codelist":
    description: An SDTMIG variable row to the SDTM CT codelist row of each code in its CDISC CT Codelist Code(s).
    slot_uri: https://kerfors.github.io/cdisc-for-all/link/sdtmig/SDTMIG#CDISC%20CT%20Codelist%20Code%28s%29
    domain: "SDTMIG"
    range: "SDTM Terminology"
    multivalued: true
    annotations:
      link: published key
      columns: '["CDISC CT Codelist Code(s)"]'
      target: '["Code"]'
      target_empty: '["Codelist Code"]'
      separator: ";"

  "sdtm-model variable to NCIt":
    description: An SDTM Model variable row to the NCIt concept of its Variable C-Code.
    slot_uri: https://kerfors.github.io/cdisc-for-all/link/sdtm-model/SDTM#Variable%20C-Code
    domain: "SDTM"
    range: "Thesaurus"
    annotations:
      link: published key
      columns: '["Variable C-Code"]'
      target: '["code"]'

  # --- NCIt

  "ncit concept to parent":
    description: An NCIt concept to each concept in its parents.
    slot_uri: https://kerfors.github.io/cdisc-for-all/link/ncit-flat/Thesaurus#parents
    domain: "Thesaurus"
    range: "Thesaurus"
    multivalued: true
    annotations:
      link: published key
      columns: '["parents"]'
      target: '["code"]'
      separator: "|"

  "nci code-cui map to NCIt":
    description: A row of the code-CUI map to the NCIt concept of its code.
    slot_uri: https://kerfors.github.io/cdisc-for-all/link/nci-code-cui-map/nci_code_cui_map#code
    domain: "nci_code_cui_map"
    range: "Thesaurus"
    annotations:
      link: published key
      columns: '["code"]'
      target: '["code"]'

  # --- Links by rule (the rule stated in each; graph by-rule)

  "sdtmig variable to model variable":
    description: An SDTMIG variable row to the SDTM Model variable row it is an instance of.
    slot_uri: https://kerfors.github.io/cdisc-for-all/rule/sdtmig/SDTMIG#Variable%20Name/sdtm-model/SDTM
    domain: "SDTMIG"
    range: "SDTM"
    annotations:
      link: by rule
      columns: '["Class", "Dataset Name", "Variable Name"]'
      target: '["Class", "Dataset Name", "Variable Name"]'
      rule_function: sdtmig-model-variable
      rule: "The first that matches: the Model row with the same Class, Dataset Name and Variable Name; else the Model row without a Dataset Name, with the same Class, whose Variable Name is the general name (the IG Variable Name with its Dataset Name prefix replaced by \"--\", or the Variable Name itself if it does not start with the Dataset Name); else the same for Class General Observations; for Class Findings About, else the same for Class Findings."

  "cosmos dataset specialization to sdtmig variable":
    description: A Dataset Specialization variable row to the SDTMIG variable row of the same name in its own domain.
    slot_uri: https://kerfors.github.io/cdisc-for-all/rule/cosmos/cdisc_sdtm_dataset_specializations_latest#sdtm_variable/sdtmig/SDTMIG
    domain: cdisc_sdtm_dataset_specializations_latest
    range: "SDTMIG"
    annotations:
      link: by rule
      columns: '["domain", "sdtm_variable"]'
      target: '["Dataset Name", "Variable Name"]'
      rule: "domain equals the SDTMIG Dataset Name and sdtm_variable equals the SDTMIG Variable Name."

  "cosmos dataset specialization to model variable":
    description: A Dataset Specialization variable row that is not an SDTMIG variable of its domain, to an SDTM Model variable row.
    slot_uri: https://kerfors.github.io/cdisc-for-all/rule/cosmos/cdisc_sdtm_dataset_specializations_latest#sdtm_variable/sdtm-model/SDTM
    domain: cdisc_sdtm_dataset_specializations_latest
    range: "SDTM"
    annotations:
      link: by rule
      columns: '["domain", "sdtm_variable"]'
      target: '["Class", "Dataset Name", "Variable Name"]'
      unless: '["cosmos dataset specialization to sdtmig variable"]'
      rule_function: cosmos-model-variable
      rule: "Only where the row has no link to an SDTMIG variable. The class of the domain is the Class the SDTMIG table gives for that Dataset Name; with it, the rule of \"sdtmig variable to model variable\" (domain as Dataset Name, sdtm_variable as Variable Name). A domain that is not an SDTMIG dataset has no class: only Class General Observations is tried."

  "cosmos dataset specialization to nsv":
    description: A Dataset Specialization variable row that is neither an SDTMIG nor an SDTM Model variable, to the NSV Registry rows of its name without the domain prefix.
    slot_uri: https://kerfors.github.io/cdisc-for-all/rule/cosmos/cdisc_sdtm_dataset_specializations_latest#sdtm_variable/nsv-registry/Approved%20NSVs-alpha
    domain: cdisc_sdtm_dataset_specializations_latest
    range: "Approved NSVs-alpha"
    annotations:
      link: by rule
      columns: '["domain", "sdtm_variable"]'
      target: '["Variable Name"]'
      unless: '["cosmos dataset specialization to sdtmig variable", "cosmos dataset specialization to model variable"]'
      targets: all
      rule_function: cosmos-nsv
      rule: "Only where the row has no link to an SDTMIG or an SDTM Model variable. sdtm_variable with the domain prefix removed (only if it starts with the domain) equals the registry Variable Name as published (no trimming). Every matching registry row is linked (the registry key is Variable Name + Source(s))."

  "cosmos value list to term":
    description: A Dataset Specialization variable row to the SDTM CT term row of each value in its value_list, within its codelist.
    slot_uri: https://kerfors.github.io/cdisc-for-all/rule/cosmos/cdisc_sdtm_dataset_specializations_latest#value_list/sdtm-ct/SDTM%20Terminology
    domain: cdisc_sdtm_dataset_specializations_latest
    range: "SDTM Terminology"
    multivalued: true
    annotations:
      link: by rule
      columns: '["codelist", "value_list"]'
      target: '["Codelist Code", "CDISC Submission Value"]'
      separator: ";"
      requires: '["codelist"]'
      rule: "Only where the row has a codelist. Each value of value_list (split at \";\") equals the CDISC Submission Value of a term row of that codelist."

  "sdtm-model variables qualified":
    description: An SDTM Model variable row to each Model variable named in its Variables Qualified, in the same class and dataset.
    slot_uri: https://kerfors.github.io/cdisc-for-all/rule/sdtm-model/SDTM#Variables%20Qualified/sdtm-model/SDTM
    domain: "SDTM"
    range: "SDTM"
    multivalued: true
    annotations:
      link: by rule
      columns: '["Class", "Dataset Name", "Variables Qualified"]'
      target: '["Class", "Dataset Name", "Variable Name"]'
      match_empty: '["Dataset Name"]'
      separator: ";"
      rule: "Each name in Variables Qualified (split at \";\", surrounding spaces removed) equals the Variable Name of a Model row with the same Class and the same Dataset Name (both empty for a variable the Model publishes for a class)."

  "cosmos relationship subject":
    description: A Dataset Specialization variable row to the variable row named in its subject, in the same Dataset Specialization.
    slot_uri: https://kerfors.github.io/cdisc-for-all/rule/cosmos/cdisc_sdtm_dataset_specializations_latest#subject/cosmos/cdisc_sdtm_dataset_specializations_latest
    domain: cdisc_sdtm_dataset_specializations_latest
    range: cdisc_sdtm_dataset_specializations_latest
    annotations:
      link: by rule
      columns: '["domain", "vlm_group_id", "subject"]'
      target: '["domain", "vlm_group_id", "sdtm_variable"]'
      rule: "subject equals the sdtm_variable of a row with the same domain and vlm_group_id."

  "cosmos relationship object":
    description: A Dataset Specialization variable row to the variable row named in its object, in the same Dataset Specialization.
    slot_uri: https://kerfors.github.io/cdisc-for-all/rule/cosmos/cdisc_sdtm_dataset_specializations_latest#object/cosmos/cdisc_sdtm_dataset_specializations_latest
    domain: cdisc_sdtm_dataset_specializations_latest
    range: cdisc_sdtm_dataset_specializations_latest
    annotations:
      link: by rule
      columns: '["domain", "vlm_group_id", "object"]'
      target: '["domain", "vlm_group_id", "sdtm_variable"]'
      rule: "object equals the sdtm_variable of a row with the same domain and vlm_group_id."
