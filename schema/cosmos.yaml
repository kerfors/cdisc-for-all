# The COSMoS base graph: the three tables of the public export (cdisc-org/COSMoS, export/), read from the CSV files.
# Hand-kept. The CSVW table group and the structural SHACL are generated from it (cfa.rule, gen-shacl).
# Class = a table, named by its file name without extension (as published, "_latest" included);
# one attribute per published column (name = header verbatim, in published order), slot_uri by the
# mapping rule; row key = unique key row_key (its slot order is the IRI order).
# The files are not named here: Reference_Versions.json pins them; a table is found by its file name.
id: https://kerfors.github.io/cdisc-for-all/def/cosmos
name: cosmos
title: COSMoS public export, as published
prefixes:
  linkml: https://w3id.org/linkml/
imports:
  - linkml:types
default_range: string
annotations:
  source: cosmos
classes:
  cdisc_biomedical_concepts_latest:
    class_uri: https://kerfors.github.io/cdisc-for-all/def/cosmos#cdisc_biomedical_concepts_latest
    unique_keys:
      row_key:
        unique_key_name: row_key
