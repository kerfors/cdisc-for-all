# The NSV Registry base graph: the sheet "Approved NSVs-alpha" as published.
# Hand-kept. The CSVW table description and the structural SHACL are generated from it (cfa.rule, gen-shacl).
# Class = the sheet, one attribute per published column (name = header verbatim, in published order),
# slot_uri by the mapping rule, row key = unique key row_key (its slot order is the IRI order).
# The file is not named here: Reference_Versions.json pins it and names its sheet (= the class name).
# header_row: the sheet row that holds the header (read by cfa.read; not part of the CSVW, which
# describes the table as read).
id: https://kerfors.github.io/cdisc-for-all/def/nsv-registry
name: nsv-registry
title: Approved Non-Standard Variable Registry, as published
prefixes:
  linkml: https://w3id.org/linkml/
imports:
  - linkml:types
default_range: string
annotations:
  source: nsv-registry
classes:
  "Approved NSVs-alpha":
    class_uri: https://kerfors.github.io/cdisc-for-all/def/nsv-registry#Approved%20NSVs-alpha
    annotations:
      header_row: 3
    unique_keys:
      row_key:
        unique_key_name: row_key
        unique_key_slots:
          - "Variable Name"
          - "Source(s)"
    attributes:
      "Variable Name":
        slot_uri: https://kerfors.github.io/cdisc-for-all/def/nsv-registry/Approved%20NSVs-alpha#Variable%20Name
        range: string
      "Label":
        slot_uri: https://kerfors.github.io/cdisc-for-all/def/nsv-registry/Approved%20NSVs-alpha#Label
        range: string
      "Description":
